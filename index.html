<script>
(() => {
  'use strict';
  const cards=document.querySelectorAll('.ui-spotlight');
  if(window.matchMedia('(hover: hover)').matches){
    cards.forEach(card => card.addEventListener('pointermove', event => {
      const rect=card.getBoundingClientRect();
      card.style.setProperty('--mouse-x',Math.round(event.clientX-rect.left)+'px');
      card.style.setProperty('--mouse-y',Math.round(event.clientY-rect.top)+'px');
    },{passive:true}));
  }
  const indicator=document.getElementById('scrollProgress');
  const portfolio=document.getElementById('portfolio');
  const updateScroll=()=>{
    const active=!portfolio.hidden;
    indicator.style.display=active?'block':'none';
    if(active){const limit=Math.max(1,document.documentElement.scrollHeight-innerHeight);indicator.style.width=Math.min(100,Math.max(0,scrollY/limit*100))+'%';}
  };
  addEventListener('scroll',updateScroll,{passive:true});
  addEventListener('hashchange',updateScroll);
  document.getElementById('accessForm')?.addEventListener('submit',()=>requestAnimationFrame(updateScroll));
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting)return;
      document.querySelectorAll('.section-nav a[aria-current]').forEach(x=>x.removeAttribute('aria-current'));
      document.querySelector('.section-nav a[href="#'+entry.target.id+'"]')?.setAttribute('aria-current','location');
    });
  },{rootMargin:'-23% 0px -55% 0px',threshold:0});
  document.querySelectorAll('main#portfolio>section[id]').forEach(section=>obs.observe(section));
  new MutationObserver(updateScroll).observe(portfolio,{attributes:true,attributeFilter:['hidden']});
  updateScroll();
})();
</script>
