name: GitHub Pages CV
on:
  push:
    branches: [main]
  # 00:00 Asia/Shanghai. Shanghai is UTC+8 all year, so midnight there is 16:00 UTC.
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seal the vault for the Shanghai day and prepare the public site
        run: python3 scripts/prepare_site.py public-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - id: deployment
        uses: actions/deploy-pages@v4
