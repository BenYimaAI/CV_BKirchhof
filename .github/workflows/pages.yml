name: GitHub Pages CV
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm the access secret still opens the registers
        env:
          CV_ACCESS_SECRET: ${{ secrets.CV_ACCESS_SECRET }}
        run: |
          if [ -z "$CV_ACCESS_SECRET" ]; then
            echo "::warning title=CV_ACCESS_SECRET is not set::Ciphertext will still deploy. Add the Actions secret so this workflow can confirm the access code decrypts the registers. See the README."
          else
            node scripts/private_vault.mjs verify
          fi
      - name: Prepare public output
        run: python3 scripts/prepare_site.py public-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - id: deployment
        uses: actions/deploy-pages@v4
