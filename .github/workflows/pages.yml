name: GitHub Pages CV
on:
  push:
    branches: [main]
  # 00:00 Asia/Shanghai. Shanghai is UTC+8 all year, so midnight there is 16:00 UTC.
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reseal the source vault when the Shanghai day has changed
        run: node scripts/private_vault.mjs reseal-source-if-stale
      - id: seal
        name: Commit the resealed source vault
        run: |
          if git diff --quiet -- private/registers.enc.json; then
            echo "Source vault is already sealed for the Shanghai day."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add private/registers.enc.json
            git commit -m "Reseal the private registers for the Shanghai day."
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ask Pages to publish the resealed branch
        if: steps.seal.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Seal the vault for the Shanghai day and prepare the public site
        run: python3 scripts/prepare_site.py public-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - id: deployment
        uses: actions/deploy-pages@v4
