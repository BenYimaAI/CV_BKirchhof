name: Development HTML QA
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build CV preview with access dialog
        run: python3 scripts/prepare_site.py .
      - name: Run interactive smoke tests
        run: node tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-development-preview
          path: |
            index.html
            docs/
            qa-evidence/
          if-no-files-found: warn
          retention-days: 14
