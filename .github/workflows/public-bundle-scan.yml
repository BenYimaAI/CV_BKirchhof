name: Public bundle scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crypto round-trip
        run: node tests/vault-roundtrip.mjs
      - name: Build the public site
        run: python3 scripts/prepare_site.py public-site
      - name: Install browser-test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke test the gateway and the gate
        env:
          CV_ACCESS_SECRET: ${{ secrets.CV_ACCESS_SECRET }}
        run: node tests/smoke.mjs public-site
